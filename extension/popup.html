<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Push It</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="header">
        <div class="title-row">
          <img src="icon128.png" alt="" class="icon" />
          <div>
            <h1>Push It</h1>
            <div class="status-row">
              <span id="statusDot" class="dot"></span>
              <span id="statusText">Not paired</span>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button id="devicePill" class="device-pill" title="Click to rename device"></button>
          <input id="deviceNameInput" class="name-input hidden" type="text" maxlength="24" />
          <button id="toggleSetup" class="btn secondary small">Pair</button>
        </div>
      </header>

      <div id="toast" class="toast hidden"></div>

      <section id="setupBox" class="card hidden">
        <label class="label" for="pairInput">Paste Pair Link from Push It web app</label>
        <input
          id="pairInput"
          type="text"
          placeholder="https://push-it...workers.dev/#key=..."
        />
        <button id="savePair" class="btn primary">Save &amp; Connect</button>
        <label class="toggle">
          <span>Auto-open incoming links</span>
          <input id="autoOpen" type="checkbox" checked />
        </label>
      </section>

      <section class="feed">
        <div class="feed-head">
          <span>Chat</span>
          <button id="clearBtn" class="link-btn">Clear</button>
        </div>
        <div id="historyList" class="history"></div>
      </section>

      <section class="composer">
        <button id="sendTab" class="btn primary full">Send Current Tab</button>
        <div class="compose-row">
          <input id="draft" type="text" placeholder="Send link or message..." />
          <button id="sendDraft" class="btn secondary">Send</button>
        </div>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
