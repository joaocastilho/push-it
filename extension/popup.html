<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Push It</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="title-row">
          <img src="icon128.png" alt="" class="icon" />
          <div>
            <h1>Push It</h1>
            <div class="status-row">
              <span id="statusDot" class="dot"></span>
              <span id="statusText">Not paired</span>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button id="toggleSearch" class="icon-toggle-btn" title="Search messages" aria-label="Search messages">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
          </button>
          <button id="devicePill" class="device-pill" title="Settings"></button>
          <button id="toggleSettings" class="btn secondary small">Settings</button>
        </div>
      </header>

      <div id="toast" class="toast hidden"></div>

      <section id="settingsView" class="settings-view hidden">
        <div id="noticeBanner" class="notice-banner hidden"></div>

        <div class="card">
          <div class="toggle">
            <strong id="devicesHeading">Devices</strong>
            <div class="item-actions">
              <button id="inviteBtn" class="btn primary small hidden">+ Invite</button>
              <button id="togglePairBtn" class="btn secondary small">Join Room</button>
            </div>
          </div>
          <div id="deviceList" class="device-list"></div>

          <div id="inviteBox" class="pair-box hidden">
            <div class="toggle">
              <span class="label">Single-use pairing code</span>
              <span id="inviteTimer" class="invite-timer">5:00</span>
            </div>
            <div class="code-display-row">
              <span id="inviteCodeDisplay" class="code-display">--- – ---</span>
              <button id="copyCodeBtn" class="btn secondary small">Copy Code</button>
            </div>
            <input id="inviteOutput" type="text" readonly />
            <div class="item-actions">
              <button id="copyInviteBtn" class="btn primary small">Copy Link</button>
              <button id="cancelInviteBtn" class="btn secondary small">Cancel</button>
            </div>
          </div>

          <div id="pairBox" class="pair-box hidden">
            <div class="pair-tabs">
              <button id="tabCodeBtn" class="chip primary" type="button">6-Digit Code</button>
              <button id="tabLinkBtn" class="chip" type="button">Invite Link</button>
            </div>

            <div id="pairByCode" class="pair-sub">
              <label class="label" for="serverUrlInput">Your Push It URL</label>
              <input id="serverUrlInput" type="text" placeholder="https://push-it.your-name.workers.dev" />
              <label class="label" for="pairCodeInput">6-digit pairing code</label>
              <input
                id="pairCodeInput"
                class="code-input"
                type="text"
                inputmode="numeric"
                maxlength="7"
                placeholder="482 917"
              />
            </div>

            <div id="pairByLink" class="pair-sub hidden">
              <label class="label" for="pairInput">Paste single-use invite link</label>
              <input id="pairInput" type="text" placeholder="https://.../#key=...&invite=..." />
            </div>

            <div id="roomPinBox" class="pair-sub hidden">
              <label class="label" for="roomPinInput">Room 6-digit PIN</label>
              <input
                id="roomPinInput"
                class="code-input"
                type="text"
                inputmode="numeric"
                maxlength="7"
                placeholder="Enter 6-digit PIN"
              />
            </div>

            <button id="savePair" class="btn primary">Join &amp; Connect</button>
          </div>
        </div>

        <div class="card">
          <label class="toggle">
            <span>Auto-open incoming links</span>
            <input id="autoOpen" type="checkbox" checked />
          </label>
        </div>

        <div class="card">
          <div class="toggle">
            <span>Chat history</span>
            <button id="clearBtn" class="btn secondary small">Clear</button>
          </div>
          <div id="leaveRow" class="toggle hidden">
            <span>Room membership</span>
            <button id="leaveBtn" class="chip danger">Leave Room</button>
          </div>
        </div>

        <div class="version-footer">
          <span id="versionText"></span>
          <span id="updateHint" class="update-pill hidden"></span>
        </div>
      </section>

      <section id="chatView" class="chat-view">
        <div id="searchBar" class="search-bar hidden">
          <input id="searchInput" type="search" placeholder="Search messages, links, or device..." />
          <span id="searchCount" class="search-count hidden"></span>
        </div>
        <div id="historyList" class="history"></div>

        <div id="targetBar" class="target-bar hidden"></div>

        <footer class="composer-area">
          <div class="quick-actions">
            <button id="sendTab" class="tab-bar-btn" title="Push the active browser tab">
              <span class="tab-bar-icon">↗</span>
              <span id="sendTabLabel" class="tab-bar-text">Push This Tab</span>
            </button>
            <button id="sendClipBtn" class="mini-pill" title="Push text or image from clipboard">
              📋
            </button>
            <button id="burnBtn" class="mini-pill" title="Auto-expire timer for next push">
              ⏱ Keep
            </button>
          </div>

          <div class="input-box">
            <input id="fileInput" type="file" class="hidden" />
            <button id="attachBtn" class="icon-action" title="Attach photo or file">+</button>
            <textarea
              id="draft"
              rows="1"
              placeholder="Write a note, paste a link or screenshot..."
            ></textarea>
            <button id="sendDraft" class="send-btn">Push It</button>
          </div>
        </footer>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
